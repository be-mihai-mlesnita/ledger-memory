[project]
name = "ledger-memory"
version = "0.3.0rc3"
description = "Append-only, auditable memory for AI agents: facts with supersession, as-of time travel, an audit trail, hybrid search, document RAG and checksummed backups. Ships an MCP server and a CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
# Approximate-nearest-neighbour lane for semantic search. Brute-force cosine works without it.
vec = ["sqlite-vec>=0.1.9"]
semantic = ["onnxruntime==1.31.0", "tokenizers==0.23.3", "truststore==0.10.5", "numpy>=2.3,<3"]
dev = ["pytest>=8"]

[project.scripts]
ledger = "ledger_memory.cli:main"
ledger-mcp = "ledger_memory.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
